<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: var(--tg-theme-bg-color, #121212); 
            --card: var(--tg-theme-secondary-bg-color, #1e1e1e); 
            --text: var(--tg-theme-text-color, #fff); 
            --hint: var(--tg-theme-hint-color, #888); 
            --success: #2ecc71; 
            --danger: #e74c3c; 
            --btn: var(--tg-theme-button-color, #2ea6ff); 
            --warning: #f39c12; 
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 8px; }
        .header { font-size: 18px; font-weight: 700; margin-bottom: 12px; text-align: center; }
        
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 8px; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 4px; }
        .acc-info { display: flex; flex-direction: column; overflow: hidden; max-width: 70%; }
        .acc-name { font-weight: 700; font-size: 15px; color: var(--text); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .acc-phone { font-size: 12px; color: var(--hint); }
        
        .header-right { display: flex; align-items: center; gap: 8px; }
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        .badge-ok { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .badge-err { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .btn-delete { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 0; margin-left: 4px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
        .info-item { display: flex; flex-direction: column; background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; }
        .info-label { color: var(--hint); font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { color: var(--text); font-weight: 500; word-break: break-word; }
        
        .proxy-box { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 11px; cursor: pointer; }
        .proxy-box:active { background: rgba(0,0,0,0.5); }
        .proxy-text { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; margin-right: 8px; }
        
        .actions { display: flex; gap: 6px; margin-top: 4px; }
        .btn-action { flex: 1; padding: 10px 4px; border: none; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; text-align: center; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .btn-buy { background: var(--success); color: #fff; }
        .btn-open { background: var(--btn); color: #fff; }
        .btn-reconnect { background: var(--warning); color: #fff; }

        .footer-fp { font-size: 9px; color: var(--hint); text-align: center; margin-top: 8px; font-family: monospace; opacity: 0.6; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; }
        .modal-content h3 { margin-top: 0; margin-bottom: 12px; font-size: 16px; }
        .modal input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); box-sizing: border-box; font-family: monospace; font-size: 12px;}
        .modal-actions { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">💎 Менеджер</div>
    <div id="accounts-list"></div>

    <!-- Модалка Прокси -->
    <div class="modal" id="proxyModal">
        <div class="modal-content">
            <h3>Сменить прокси</h3>
            <input type="text" id="newProxyInput" placeholder="Любой формат (login:pass@host:port)">
            <div class="modal-actions">
                <button class="modal-btn" style="background: var(--hint); color: #fff;" onclick="closeModal('proxyModal')">Отмена</button>
                <button class="modal-btn" id="saveBtn" style="background: var(--success); color: #fff;" onclick="saveProxy()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модалка Оплаты -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <div id="payContent">
                <div class="spinner"></div>
                <h3>Заходим в @PremiumBot...</h3>
                <p style="font-size:12px; color:var(--hint);">Это займет пару секунд.</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const API_URL = window.location.origin; 
        let currentAccountId = null;

        async function fetchAccounts() {
            try {
                const res = await fetch(`${API_URL}/api/accounts`);
                if (!res.ok) throw new Error("Сервер не отвечает");
                const accounts = await res.json();
                const listEl = document.getElementById('accounts-list');
                
                if (accounts.length === 0) {
                    listEl.innerHTML = "<div style='text-align:center; color:var(--hint); font-size:14px; margin-top:20px;'>Нет аккаунтов.</div>";
                    return;
                }
                
                listEl.innerHTML = accounts.map(acc => {
                    const isPremium = acc.premium;
                    const premText = isPremium ? `До ${acc.premium_expires}` : 'Нет Premium';
                    const premColor = isPremium ? 'var(--success)' : 'var(--danger)';
                    
                    const isConnected = acc.status && acc.status.includes('✅');
                    const statusClass = isConnected ? 'badge-ok' : 'badge-err';
                    const statusText = isConnected ? 'ONLINE' : (acc.status ? 'ERROR' : 'UNKNOWN');

                    const proxyDisplay = acc.proxy && acc.proxy !== "Нет" ? acc.proxy : "Не назначен";
                    
                    return `
                    <div class="card" id="card-${acc.id}">
                        <div class="card-header">
                            <div class="acc-info">
                                <div class="acc-name">${acc.username}</div>
                                <div class="acc-phone">${acc.phone}</div>
                            </div>
                            <div class="header-right">
                                <div class="badge ${statusClass}">${statusText}</div>
                                <button class="btn-delete" onclick="deleteAcc('${acc.id}')">🗑</button>
                            </div>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Аккаунт (Страна)</span>
                                <span class="info-value">${acc.flag || '🏳️'} ${acc.account_country || 'Неизвестно'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Прокси (Страна)</span>
                                <span class="info-value" id="proxy-info-${acc.id}">${acc.proxy_flag || '🏳️'} ${acc.proxy_country || 'Неизвестно'} (⚡${acc.speed} ms)</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Premium</span>
                                <span class="info-value" style="color: ${premColor};">${premText}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">IP адрес</span>
                                <span class="info-value">${acc.ip || '0.0.0.0'}</span>
                            </div>
                        </div>

                        <div class="proxy-box" onclick="copyProxy('${acc.proxy}')">
                            <span class="proxy-text">${proxyDisplay}</span>
                            <span style="color: var(--hint);">📋</span>
                        </div>

                        <div class="actions">
                            <button class="btn-action btn-buy" onclick="buyPremium('${acc.id}')">💎 Купить</button>
                            <button class="btn-action btn-open" onclick="openBot('${acc.username}')">📱 Открыть</button>
                            <button class="btn-action btn-reconnect" onclick="openModal('${acc.id}')">🔄 Прокси</button>
                        </div>
                        
                        <div class="footer-fp">FP: ${acc.device_fp || 'unknown'}</div>
                    </div>
                    `;
                }).join("");
            } catch (e) { 
                document.getElementById('accounts-list').innerHTML = `<div style='text-align:center; color:var(--danger); margin-top:20px;'>Ошибка: ${e.message}</div>`;
            }
        }

        function copyProxy(proxy) {
            if (!proxy || proxy === "Нет" || proxy === "Не назначен") return;
            navigator.clipboard.writeText(proxy).then(() => {
                tg.showAlert("✅ Прокси скопирован!");
            }).catch(() => {
                tg.showAlert("❌ Ошибка копирования");
            });
        }

        async function deleteAcc(accId) {
            tg.showPopup({
                title: 'Удаление',
                message: 'Точно удалить этот аккаунт?',
                buttons: [{id: 'yes', type: 'destructive', text: 'Удалить'}, {id: 'cancel', type: 'cancel'}]
            }, async function(btnId) {
                if (btnId === 'yes') {
                    try {
                        const res = await fetch(`${API_URL}/api/delete_account`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ account_id: accId })
                        });
                        if (res.ok) document.getElementById(`card-${accId}`).remove();
                    } catch(e) { tg.showAlert("Ошибка сети"); }
                }
            });
        }

        function openModal(accountId) {
            currentAccountId = accountId;
            document.getElementById('newProxyInput').value = "";
            document.getElementById('proxyModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        async function saveProxy() {
            const newProxy = document.getElementById('newProxyInput').value.trim();
            if (!newProxy) return tg.showAlert("Введите прокси");

            const btn = document.getElementById('saveBtn');
            btn.innerText = "Проверка...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/update_proxy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account_id: currentAccountId, new_proxy: newProxy })
                });
                
                const data = await res.json();
                if (data.status === 'ok') {
                    tg.showAlert("✅ Прокси обновлен!");
                    closeModal('proxyModal');
                    
                    document.getElementById('proxy-info-' + currentAccountId).innerHTML = `${data.proxy_flag} ${data.proxy_country} (⚡${data.speed} ms)`;
                    const card = document.getElementById('card-' + currentAccountId);
                    card.querySelector('.proxy-text').innerText = newProxy;
                    card.querySelectorAll('.info-value')[3].innerText = data.ip;
                } else {
                    tg.showAlert("Ошибка: " + data.message);
                }
            } catch (e) {
                tg.showAlert("Ошибка соединения: " + e.message);
            } finally {
                btn.innerText = "Сохранить";
                btn.disabled = false;
            }
        }

        async function buyPremium(accountId) {
            document.getElementById('payContent').innerHTML = `
                <div class="spinner"></div>
                <h3>Заходим в @PremiumBot...</h3>
                <p style="font-size:12px; color:var(--hint);">Это займет пару секунд.</p>
            `;
            document.getElementById('payModal').style.display = 'flex';

            try {
                const res = await fetch(`${API_URL}/api/buy_premium`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account_id: accountId })
                });
                const data = await res.json();
                
                if (data.status === 'ok' && data.link) {
                    document.getElementById('payContent').innerHTML = `
                        <h3 style="color: var(--success);">✅ Успешно!</h3>
                        <p style="font-size:12px;">Бот сгенерировал ссылку на оплату.</p>
                        <button class="modal-btn btn-buy" onclick="window.open('${data.link}', '_blank'); closeModal('payModal');">Перейти к оплате</button>
                    `;
                } else {
                    document.getElementById('payContent').innerHTML = `
                        <h3 style="color: var(--danger);">❌ Ошибка</h3>
                        <p style="font-size:12px;">${data.message || 'Не удалось получить ссылку.'}</p>
                        <button class="modal-btn" style="background: var(--hint); color: #fff;" onclick="closeModal('payModal')">Закрыть</button>
                    `;
                }
            } catch (e) {
                document.getElementById('payContent').innerHTML = `
                    <h3 style="color: var(--danger);">❌ Сеть</h3>
                    <p style="font-size:12px;">Ошибка соединения с сервером.</p>
                    <button class="modal-btn" style="background: var(--hint); color: #fff;" onclick="closeModal('payModal')">Закрыть</button>
                `;
            }
        }

        function openBot(username) {
            if (!username || username.startsWith('Аккаунт') || username.startsWith('Без имени')) {
                tg.showAlert("У этого аккаунта нет юзернейма.");
                return;
            }
            tg.openLink(`https://t.me/${username}`);
        }

        document.addEventListener('DOMContentLoaded', () => { fetchAccounts(); });
    </script>
</body>
</html>
