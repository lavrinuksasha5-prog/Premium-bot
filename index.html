<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: var(--tg-theme-bg-color, #121212); --card: var(--tg-theme-secondary-bg-color, #1e1e1e); --text: var(--tg-theme-text-color, #fff); --hint: var(--tg-theme-hint-color, #888); --btn: var(--tg-theme-button-color, #2ea6ff); --success: #2ecc71; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .header { font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card); background: var(--bg); color: var(--text); margin-bottom: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--btn); color: #fff; }
        .btn-buy { background: var(--success); color: #fff; padding: 8px; font-size: 14px; margin-top: 0; }
        .account-row { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 12px; }
        .account-info { display: flex; justify-content: space-between; font-size: 14px; }
        .status-ok { color: var(--success); }
        .status-error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">💎 Premium Manager</div>
    
    <div class="card">
        <div style="font-weight: 600; margin-bottom: 8px;">1. Вставьте прокси (Ротационный)</div>
        <input type="text" id="proxy-input" placeholder="socks5://user:pass@ip:port">
        <button class="btn btn-primary" onclick="startCheck()">2. Проверить аккаунты</button>
        <div style="font-size: 12px; color: var(--hint); margin-top: 8px; text-align: center;">
            * Перед проверкой загрузите ZIP с TData в чат с ботом.
        </div>
    </div>

    <div id="accounts-list">
        <div style="text-align:center; color:var(--hint); padding: 20px;">Загрузка списка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const API_URL = "https://worker-production-578b44ee.up.railway.app"; // ТВОЙ НОВЫЙ СЕРВЕР
        let accountsData = [];

        async function startCheck() {
            const proxy = document.getElementById('proxy-input').value.trim();
            if (!proxy) return tg.showAlert("Введи прокси!");
            
            tg.showAlert("Запускаю проверку аккаунтов через прокси... (Ждите)");
            
            try {
                const res = await fetch(`${API_URL}/api/start_check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proxy: proxy })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    tg.showAlert(data.message);
                    fetchAccounts(); // Обновить список через пару секунд
                } else {
                    tg.showAlert("Ошибка: " + data.message);
                }
            } catch (e) {
                tg.showAlert("Ошибка соединения");
            }
        }

        async function fetchAccounts() {
            try {
                const res = await fetch(`${API_URL}/api/accounts`);
                accountsData = await res.json();
                const listEl = document.getElementById('accounts-list');
                
                if (accountsData.length === 0) {
                    listEl.innerHTML = "<div style='text-align:center; color:var(--hint);'>Аккаунтов пока нет. Загрузите ZIP в бота.</div>";
                    return;
                }

                listEl.innerHTML = accountsData.map(acc => `
                    <div class="card account-row">
                        <div class="account-info">
                            <div><b>${acc.username || 'Аккаунт'}</b></div>
                            <div class="${acc.valid ? 'status-ok' : 'status-error'}">${acc.valid ? 'Валиден' : 'Ошибка'}</div>
                        </div>
                        <div style="font-size: 12px; color: var(--hint);">IP: ${acc.ip || 'N/A'}</div>
                        <div style="font-size: 12px; color: var(--hint);">Устройство: ${acc.device || 'N/A'}</div>
                        <button class="btn btn-buy" onclick="buyPremium('${acc.id}')">Купить Premium</button>
                    </div>
                `).join("");
            } catch (e) { console.error(e); }
        }

        function buyPremium(accountId) {
            tg.showAlert("Открываю окно оплаты...");
            // Логика запроса ссылки на оплату
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAccounts();
            setInterval(fetchAccounts, 5000); // Автообновление
        });
    </script>
</body>
</html>
